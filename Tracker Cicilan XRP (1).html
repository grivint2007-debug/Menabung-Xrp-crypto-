<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tracker Cicilan XRP</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#161a2b;--mu:#6b7186;--ac:#2563eb;--bd:#e3e6ef;--up:#16a34a;--dn:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#181c2f;--tx:#eef0f8;--mu:#9aa0b8;--ac:#6ea0ff;--bd:#272c45;--up:#4ade80;--dn:#f87171}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#181c2f;--tx:#eef0f8;--mu:#9aa0b8;--ac:#6ea0ff;--bd:#272c45;--up:#4ade80;--dn:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
.w{max-width:560px;margin:0 auto}
h1{font-size:24px;font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:10px}h1 svg{flex-shrink:0}h1 span{background:linear-gradient(90deg,#22d3ee,#a3e635,#facc15);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.c{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:14px}
.w>div.c:nth-of-type(2){border-color:#22d3ee;background:linear-gradient(160deg,rgba(34,211,238,.18),rgba(34,211,238,.04)),var(--card);box-shadow:0 0 14px rgba(34,211,238,.45)}
.w>div.c:nth-of-type(3){border-color:#a3e635;background:linear-gradient(160deg,rgba(163,230,53,.18),rgba(163,230,53,.04)),var(--card);box-shadow:0 0 14px rgba(163,230,53,.45)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:3px}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:15px}
button{padding:11px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:600;font-size:15px;width:100%;margin-top:10px}
.s{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.s div b{display:block;font-size:17px}
.s small{color:var(--mu);font-size:12px}
.up{color:var(--up)}.dn{color:var(--dn)}
.r{color:var(--up);display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--bd);font-size:14px}
.r:first-child{border-top:0}
.r small{color:var(--up);display:block}
.w>div.c:first-of-type{display:none}
.x{background:none;color:var(--dn);width:auto;margin:0;padding:6px 10px}
</style>
</head>
<body>
<div class="w">
<h1><svg width="36" height="36" viewBox="0 0 32 32" aria-label="XRP"><circle cx="16" cy="16" r="15" fill="#23292f" stroke="#22d3ee" stroke-width="1.5"/><path d="M9.5 9.5Q16 16.5 22.5 9.5M9.5 22.5Q16 15.5 22.5 22.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg><span>Grivint Rajin Menabung XRP</span></h1>
<p style="margin:-6px 0 14px 46px;font-size:16px;font-weight:700;letter-spacing:.5px;color:#facc15">for 3 years</p>

<div class="c">
<div class="s">
<div><small>Total modal</small><b id="mod">Rp0</b></div>
<div><small>Total XRP</small><b id="tx">0</b></div>
<div><small>Harga rata-rata (average price)</small><b id="avg">Rp0</b></div>
<div><small>Untung/rugi (profit/loss)</small><b id="pl">-</b></div>
</div>
<div style="margin-top:12px"><label>Harga XRP sekarang (Rp), isi manual</label>
<input id="now" type="number" inputmode="decimal" placeholder="contoh: 35000"></div>
</div>

<div class="c">
<div class="g">
<div><label>Tanggal</label><input id="d" type="date"></div>
<div><label>Harga beli per XRP (Rp)</label><input id="p" type="number" inputmode="decimal" placeholder="35000"></div>
</div>
<div style="margin-top:10px"><label>Nominal cicilan (Rp)</label>
<input id="n" type="number" inputmode="decimal" placeholder="100000"></div>
<button id="add">Simpan catatan</button>
</div>

<div class="c"><div id="list"></div></div>
</div>

<script>
var K="xrp_tracker_v1",data=[],nowP="",pend=-1;
try{data=JSON.parse(localStorage.getItem(K)||"[]");nowP=localStorage.getItem(K+"_now")||""}catch(e){data=[]}
var $=function(i){return document.getElementById(i)};
function rp(v){return "Rp"+Math.round(v).toLocaleString("id-ID")}
function save(){try{localStorage.setItem(K,JSON.stringify(data));localStorage.setItem(K+"_now",$("now").value)}catch(e){}}
function render(){
var mod=0,xrp=0;
data.forEach(function(e){mod+=e.n;xrp+=e.n/e.p});
$("mod").textContent=rp(mod);
$("tx").textContent=xrp.toLocaleString("id-ID",{maximumFractionDigits:4});
$("avg").textContent=xrp?rp(mod/xrp):"Rp0";
var now=parseFloat($("now").value),pl=$("pl");
if(now&&xrp){var v=now*xrp-mod,pc=v/mod*100;pl.className=v>=0?"up":"dn";pl.textContent=(v>=0?"+":"-")+rp(Math.abs(v))+" ("+pc.toFixed(1)+"%)"}
else{pl.className="";pl.textContent="-"}
var h="";
data.slice().reverse().forEach(function(e,i){
var idx=data.length-1-i;
h+='<div class="r"><div>'+e.d+'<small>'+rp(e.n)+' @ '+rp(e.p)+' = '+(e.n/e.p).toFixed(4)+' XRP</small></div>'+(pend===idx?'<div><small style="color:var(--dn)">Yakin mau hapus?</small><button class="x" data-a="no">Batal</button><button class="x" data-a="yes" data-i="'+idx+'">Ya, hapus</button></div>':'<button class="x" data-i="'+idx+'">Hapus</button>')+'</div>'});
$("list").innerHTML=h||'<small style="color:var(--mu)">Belum ada cicilan.</small>';
}
$("add").onclick=function(){
var p=parseFloat($("p").value),n=parseFloat($("n").value),d=$("d").value;
if(!p||!n||p<=0||n<=0)return;
pend=-1;data.push({d:d||new Date().toISOString().slice(0,10),p:p,n:n});
$("p").value="";$("n").value="";save();render()};
$("list").onclick=function(e){var t=e.target,a=t.getAttribute("data-a"),i=t.getAttribute("data-i");if(a==="yes"){data.splice(+i,1);pend=-1;save();render()}else if(a==="no"){pend=-1;render()}else if(i!==null){pend=+i;render()}};
$("now").oninput=function(){save();render()};
$("now").value=nowP;
$("d").value=new Date().toISOString().slice(0,10);
render();
</script>
</body>
</html>
